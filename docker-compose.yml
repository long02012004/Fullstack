version: '3.8'

services:
  mysqldb:
    image: mysql:8.0 
    container_name: mysql_container_local
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: fullstack
      MYSQL_USER: QLong
      MYSQL_PASSWORD: 123456
    ports:
      - "3306:3306" 
    volumes:
      - db_data:/var/lib/mysql # Để dữ liệu không bị mất khi tắt Docker

volumes:
  db_data: